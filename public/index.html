<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bee - High Score API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .highscore-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .highscore-display h2 {
            font-size: 1.2em;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .highscore-display .score {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .highscore-display .name {
            font-size: 1.3em;
            opacity: 0.95;
        }
        
        .form-section {
            margin-top: 30px;
        }
        
        .form-section h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .loader {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        
        .loader.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐝 Flappy Bee</h1>
        <p class="subtitle">High Score Tracker</p>
        
        <div class="highscore-display">
            <h2>Current High Score</h2>
            <div class="score" id="currentScore">0</div>
            <div class="name" id="currentName">No scores yet</div>
        </div>
        
        <div class="form-section">
            <h3>Submit Your Score</h3>
            <form id="scoreForm">
                <div class="form-group">
                    <label for="playerName">Player Name</label>
                    <input type="text" id="playerName" name="name" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="playerScore">Score</label>
                    <input type="number" id="playerScore" name="score" required min="0" placeholder="Enter your score">
                </div>
                <button type="submit">Submit Score</button>
            </form>
            <div class="loader" id="loader">
                <p>Loading...</p>
            </div>
            <div class="message" id="message"></div>
        </div>
    </div>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <!-- App JavaScript -->
    <script>
        const API_BASE = '/api';
        
        // Load current high score on page load
        async function loadHighScore() {
            try {
                const response = await fetch(`${API_BASE}/highscore`);
                const data = await response.json();
                
                if (data.score > 0) {
                    document.getElementById('currentScore').textContent = data.score;
                    document.getElementById('currentName').textContent = data.name;
                }
            } catch (error) {
                console.error('Error loading high score:', error);
                showMessage('Failed to load high score', 'error');
            }
        }
        
        // Submit new score
        document.getElementById('scoreForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('playerName').value.trim();
            const score = parseInt(document.getElementById('playerScore').value);
            
            if (!name || isNaN(score) || score < 0) {
                showMessage('Please enter valid name and score', 'error');
                return;
            }
            
            const loader = document.getElementById('loader');
            loader.classList.add('active');
            
            try {
                const response = await fetch(`${API_BASE}/highscore`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, score })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    if (data.message.includes('New high score')) {
                        showMessage(`🎉 ${data.message}`, 'success');
                        
                        // Track custom event for new high score
                        if (window.va) {
                            window.va('event', {
                                name: 'new_high_score',
                                data: {
                                    score: score,
                                    player: name
                                }
                            });
                        }
                        
                        // Update display
                        document.getElementById('currentScore').textContent = data.score;
                        document.getElementById('currentName').textContent = data.name;
                    } else {
                        showMessage(data.message, 'info');
                    }
                    
                    // Track score submission
                    if (window.va) {
                        window.va('event', {
                            name: 'score_submitted',
                            data: {
                                score: score
                            }
                        });
                    }
                    
                    // Clear form
                    document.getElementById('scoreForm').reset();
                } else {
                    showMessage(data.message || 'Failed to submit score', 'error');
                }
            } catch (error) {
                console.error('Error submitting score:', error);
                showMessage('Failed to submit score. Please try again.', 'error');
            } finally {
                loader.classList.remove('active');
            }
        });
        
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }
        
        // Load high score when page loads
        loadHighScore();
        
        // Track page view
        if (window.va) {
            window.va('pageview', { path: window.location.pathname });
        }
    </script>
</body>
</html>
